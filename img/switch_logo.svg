<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%">
  <!-- Canvas: Pure Black -->
  <rect width="100%" height="100%" fill="#000000" rx="16"/>

  <!-- Logo Icon Container (Dark Rounded Square Badge matching site header) -->
  <g transform="translate(60, 30)">
    <!-- Dark Badge Card -->
    <rect x="0" y="0" width="180" height="180" rx="40" fill="#0c0c0e" stroke="#222226" stroke-width="2"/>
    
    <!-- Joy-Con Emblem Pills inside Badge -->
    <g transform="translate(38, 38)">
      <!-- Left Pill -->
      <rect x="0" y="0" width="44" height="104" rx="22" fill="none" stroke="#FFFFFF" stroke-width="8"/>
      <!-- Left Dot (Top) -->
      <circle cx="22" cy="28" r="9" fill="#FFFFFF"/>

      <!-- Right Pill -->
      <rect x="60" y="0" width="44" height="104" rx="22" fill="none" stroke="#FFFFFF" stroke-width="8"/>
      <!-- Right Dot (Bottom) -->
      <circle cx="82" cy="76" r="9" fill="#FFFFFF"/>
    </g>
  </g>

  <!-- Typography "SWITCH" -->
  <g transform="translate(280, 140)">
    <!-- Title "SWITCH" -->
    <text font-family="'Unbounded', 'Montserrat', 'Arial Black', sans-serif" font-weight="900" font-size="82" fill="#FFFFFF" letter-spacing="4">SWITCH</text>
    <!-- Subtitle "WEB STUDIO" -->
    <text y="44" font-family="'Sora', 'Inter', 'Arial', sans-serif" font-weight="600" font-size="20" fill="#71717A" letter-spacing="12">WEB STUDIO</text>
  </g>
</svg>
