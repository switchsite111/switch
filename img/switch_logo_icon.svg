<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <!-- Black Background -->
  <rect width="100%" height="100%" fill="#000000" rx="48"/>

  <!-- Logo Icon Container (Dark Badge) -->
  <g transform="translate(30, 30)">
    <rect x="0" y="0" width="240" height="240" rx="54" fill="#0c0c0e" stroke="#222226" stroke-width="3"/>
    
    <!-- Joy-Con Emblem Pills inside Badge -->
    <g transform="translate(50, 50)">
      <!-- Left Pill -->
      <rect x="0" y="0" width="60" height="140" rx="30" fill="none" stroke="#FFFFFF" stroke-width="11"/>
      <!-- Left Dot (Top) -->
      <circle cx="30" cy="38" r="12" fill="#FFFFFF"/>

      <!-- Right Pill -->
      <rect x="80" y="0" width="60" height="140" rx="30" fill="none" stroke="#FFFFFF" stroke-width="11"/>
      <!-- Right Dot (Bottom) -->
      <circle cx="110" cy="102" r="12" fill="#FFFFFF"/>
    </g>
  </g>
</svg>
